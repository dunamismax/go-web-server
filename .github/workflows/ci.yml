name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gowebserver
          POSTGRES_PASSWORD: gowebserver
          POSTGRES_DB: gowebserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gowebserver -d gowebserver"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      # go.mod names the toolchain, so CI and local builds use the same Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Regenerates the sqlc, templ and Tailwind output with the versions
      # pinned in the Makefile and fails if the checked-in copies differ.
      - name: Verify generated code is current
        run: make check-generated

      - name: Lint
        run: make lint

      # TEST_DATABASE_URL defaults to the service container above.
      - name: Test
        run: make test

      - name: Scan for known vulnerabilities
        run: make vuln

      - name: Build
        run: make build

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: go-web-server:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has no shell, so ask the binary itself.
      - name: Smoke-test the image
        run: test "$(docker run --rm go-web-server:ci version)" = "${{ github.sha }}"
